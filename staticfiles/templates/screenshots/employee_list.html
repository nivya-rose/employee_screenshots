<!DOCTYPE html>
<html>
    <head>
        <title>Employee Screenshots</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    </head>
<body>
<div class="container mt-4">
        <h2>Employee Screenshots</h2>
        <table class="table table-bordered">
             <thead>
            <tr>
                <th>Name</th>
                <th>Phone</th>
                <th>Register Number</th>
                <th>Month</th>
                <th>View Screenshot</th>
                <th>View Chat Screenshot</th>
            </tr>
        </thead>
        <tbody>
            {% for emp in employees %}
            <tr>
                <td>{{ emp.name }}</td>
                <td>{{ emp.phone_number }}</td>
                <td>{{ emp.month }}</td>
                <td><a href="{% url 'view_screenshot' emp.id %}" class="btn btn-primary">View</a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
