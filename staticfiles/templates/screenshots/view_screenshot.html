<!DOCTYPE html>
<html>
<head>
    <title>{{ screenshot.name }} Screenshot</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2>{{ screenshot.name }} - {{ screenshot.month }}</h2>
    
    {% if screenshot.local_file %}
        
        <img src="{{ screenshot.local_file.url }}" alt="Screenshot" style="max-width:500px;">
    {% else %}
      
        <p>No local screenshot available.</p>
        <a href="https://drive.google.com/file/d/{{ screenshot.drive_file_id }}/view" target="_blank" class="btn btn-primary">
            View on Drive
        </a>
    {% endif %}
    
    <br><br>
    <a href="{% url 'employee_list' %}" class="btn btn-secondary">Back</a>
</div>
</body>
</html>
