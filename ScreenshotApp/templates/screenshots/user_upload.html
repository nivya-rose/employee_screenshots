<!DOCTYPE html>
<html>
<head>
    <title>Upload Screenshots</title>
</head>
<body>
    <!-- Display Django messages -->
    {% if messages %}
        {% for message in messages %}
            <p>
                {{ message }}
            </p>
        {% endfor %}
    {% endif %}

    <!-- Upload form -->
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <label>Name:</label><br>
        <input type="text" name="name" required><br><br>

        <label>Phone Number:</label><br>
        <input type="text" name="phone_number" required><br><br>

        <label>Register Number:</label><br>
        <input type="text" name="register_number" required><br><br>

        <label>Company Email:</label><br>
        <input type="email" name="useremail" required><br><br>

        <label>Backup Screenshot:</label><br>
        <input type="file" name="backup_file" accept="image/*" required><br><br>

        <label>Chat Screenshot:</label><br>
        <input type="file" name="chat_file" accept="image/*" required><br><br>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
